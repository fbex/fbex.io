<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="fbex">
  <defs>
    <!-- Mirrors the .wordmark sweep in global.css: chalk with a narrow
         cyan → magenta specular band, not a full-spectrum gradient.
         userSpaceOnUse so the sweep runs once across the whole glyph — the
         default objectBoundingBox restarts it per path, and paints nothing
         at all on the crossbar, whose bounding box has zero height. -->
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="14" y1="10" x2="52" y2="52">
      <stop offset="0%" stop-color="#eef1ff"/>
      <stop offset="50%" stop-color="#eef1ff"/>
      <stop offset="60%" stop-color="#43daf1"/>
      <stop offset="70%" stop-color="#ff65b7"/>
    </linearGradient>
    <!-- A trace of the WebGL backdrop's violet bloom. Kept faint so the tile
         still reads as the site's near-black ink at tab size. -->
    <radialGradient id="bloom" cx="0.28" cy="0.2" r="0.62">
      <stop offset="0%" stop-color="#6b3bff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6b3bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="#05060d"/>
  <rect width="64" height="64" rx="15" fill="url(#bloom)"/>

  <!-- Lowercase f, matching the lowercase wordmark. Stroked rather than
       filled so the weight stays even when rasterised down to 16px. -->
  <g fill="none" stroke="url(#sheen)" stroke-width="6.5" stroke-linecap="round">
    <path d="M43 15c-8-3-12 0.5-12 8V49"/>
    <path d="M22 29h20"/>
  </g>
</svg>
